name: Fence policy evidence

on:
  pull_request:
    paths:
      - ".garnet/**"
      - ".github/workflows/fence-policy-evidence.yml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-observe:
    name: Observe locked dependency fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.15.0

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml

  policy-review:
    name: Review observed behavior against policy
    needs: policy-observe
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      result: ${{ steps.review.outputs.result }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned garnetctl
        env:
          GARNETCTL_SHA256: df30cd424388d664834f6f91947174d0f465f426062c531bd9f38bf667347dfe
          GARNETCTL_VERSION: v1.33.3
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/garnet-org/garnetctl-releases/releases/download/${GARNETCTL_VERSION}/garnetctl_Linux_x86_64.tar.gz" \
            --output "${RUNNER_TEMP}/garnetctl.tar.gz"
          echo "${GARNETCTL_SHA256}  ${RUNNER_TEMP}/garnetctl.tar.gz" | sha256sum --check
          tar xzf "${RUNNER_TEMP}/garnetctl.tar.gz" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/garnetctl"

      - name: Build policy review
        id: review
        env:
          GARNET_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
        run: |
          set +e
          python3 .garnet/tools/fence_policy_review.py \
            --policy .garnet/fence-policy.txt \
            --output "${RUNNER_TEMP}/fence-policy-review.md" \
            --garnetctl "${RUNNER_TEMP}/garnetctl" \
            --run-id "${GITHUB_RUN_ID}" \
            --job policy-observe \
            --repository "${GITHUB_REPOSITORY}"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "result=match" >> "$GITHUB_OUTPUT"
          else
            echo "result=review-required" >> "$GITHUB_OUTPUT"
          fi
          cat "${RUNNER_TEMP}/fence-policy-review.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload policy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fence-policy-evidence
          path: ${{ runner.temp }}/fence-policy-review.md
          if-no-files-found: error

  policy-enforce:
    name: Enforce approved policy on identical workload
    needs: policy-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Fence must be the first step. The reviewed policy is intentionally
      # committed inline because reading repository files requires checkout.
      - name: Start Fence in block mode
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          mode: block
          allowlist: |
            index.crates.io
            static.crates.io

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml

  publish-review:
    name: Publish policy decision in the PR
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - policy-observe
      - policy-review
      - policy-enforce
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download policy evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fence-policy-evidence
          path: ${{ runner.temp }}/policy-evidence

      - name: Publish or update the policy review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ENFORCEMENT_RESULT: ${{ needs.policy-enforce.result }}
          OBSERVATION_RESULT: ${{ needs.policy-observe.result }}
          POLICY_REVIEW_RESULT: ${{ needs.policy-review.result }}
          REPORT_PATH: ${{ runner.temp }}/policy-evidence/fence-policy-review.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const marker = "<!-- garnet-fence-policy-evidence -->";
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const passed =
              process.env.OBSERVATION_RESULT === "success" &&
              process.env.POLICY_REVIEW_RESULT === "success" &&
              process.env.ENFORCEMENT_RESULT === "success";
            const decision = passed ? "PASS" : "REVIEW REQUIRED";
            const summary = passed
              ? "The checked-in egress policy matched the behavior Garnet observed, and Fence allowed the identical workload to complete in block mode."
              : "The evidence or enforcement chain is incomplete. Do not add or remove policy entries until the failed stage is reviewed.";
            const body = [
              marker,
              "# Garnet + Fence runtime policy review",
              "",
              `**Decision: ${decision}**`,
              "",
              summary,
              "",
              "## Why this is useful",
              "",
              "- **Garnet explains the policy:** which destination the covered job used, with process and workflow context.",
              "- **Fence enforces the policy:** the same workload is replayed with undeclared egress blocked.",
              "- **The reviewer stays in the PR:** policy delta, coverage, runtime receipt, and enforcement result are attached to this commit.",
              "",
              "## End-to-end result",
              "",
              "| Stage | Result | What it answers |",
              "| --- | --- | --- |",
              `| Observe with Garnet | **${process.env.OBSERVATION_RESULT}** | What did this job actually contact? |`,
              `| Review policy delta | **${process.env.POLICY_REVIEW_RESULT}** | Does the checked-in policy explain it? |`,
              `| Replay with Fence | **${process.env.ENFORCEMENT_RESULT}** | Is that policy sufficient in block mode? |`,
              "",
              "**Coverage boundary:** one GitHub-hosted Ubuntu job running the locked Codex Rust dependency fetch. This is not a repository-wide, macOS, Windows, or self-hosted-runner claim.",
              "",
              `**Evidence commit:** \`${context.sha}\``,
              "",
              report,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const previous = comments.find(
              (comment) =>
                comment.user.type === "Bot" && comment.body.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
