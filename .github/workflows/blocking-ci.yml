name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  garnet:
    name: Garnet Runtime Review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.15.0

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml

  fence-enforced:
    name: Fence enforcing the Garnet-derived allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Same workload as the `garnet` job above, with Fence enforcing the
      # allowlist derived from Garnet's record of that job
      # (.garnet/fence-allowlist.suggested.txt). Block mode removes
      # passwordless sudo, which the Garnet sensor's shutdown needs, so this
      # lane enforces without the sensor; the record behind the allowlist
      # comes from the sensor-instrumented runs of the `garnet` job.
      - name: Fence
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          mode: block
          # Kept in sync with .garnet/fence-allowlist.suggested.txt, the
          # output of .garnet/tools/build_fence_allowlist.py.
          allowlist: |
            # cargo landed on dualstack.k.sni.global.fastly.net in 10 of 10 recorded runs
            index.crates.io
            static.crates.io
            # github.com: in Fence's default GitHub profile, no entry needed (cargo; 10 of 10 recorded runs)
            # localhost: mediated by Fence's own platform rules, no entry needed (10 of 10 recorded runs)

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - garnet
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
